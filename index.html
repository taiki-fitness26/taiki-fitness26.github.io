</style></head><body><style>.calendar-layout{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.calendar-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calendar-nav button{padding:7px 12px}.calendar-week,.calendar-days{display:grid;grid-template-columns:repeat(7,1fr)}.calendar-week span{text-align:center;color:var(--muted);font-size:11px;padding:6px}.cal-day{min-height:70px;border:1px solid var(--line);margin:-1px 0 0 -1px;padding:7px;background:white;text-align:left;border-radius:0;font-weight:500;position:relative}.cal-day.out{background:#f7f7f3;color:#b1b6b2}.cal-day.today{box-shadow:inset 0 0 0 2px var(--green)}.cal-day.selected{background:#edf5ce}.cal-day.has::after{content:'';position:absolute;left:7px;bottom:7px;width:7px;height:7px;border-radius:50%;background:var(--orange)}.day-detail{background:#f0f2ed;border-radius:14px;padding:16px}.day-detail h3{margin:0 0 10px;font-size:15px}.calendar-empty{color:var(--muted);font-size:12px}.log-grid{grid-template-columns:1fr 1.4fr repeat(3,.7fr) auto}@media(max-width:720px){.calendar-layout{grid-template-columns:1fr}.cal-day{min-height:52px;padding:5px}.log-grid{grid-template-columns:1fr 1fr}.log-grid button{grid-column:1/-1}}</style><main class="app"><header><div class="brand"><div class="mark">↑</div><div><h1>FORGE</h1><p>トレーニングと体調を、シンプルに記録。</p></div></div><div class="date" id="today"></div></header>
<section class="hero"><div><div class="eyebrow">BENCH PRESS GOAL</div><h2>100kgへの距離を<br><span id="benchDistance">33.5kg</span>縮める。</h2><p class="muted" style="color:#aeb8b2">トレーニング実績から推定1RMを計算しています。</p><div class="progress-track"><div class="progress-bar" id="benchProgress"></div></div></div><div class="hero-stats"><div class="hero-stat"><small>推定 1RM</small><b id="estimated1rm"></b></div><div class="hero-stat"><small>ゴール</small><b>100 kg</b></div></div></section><div class="grid">
<section class="card"><div class="title-row"><h2>今日のコンディション</h2><span class="pill">DAILY</span></div><div class="form-grid"><div><label>体重（kg）</label><input id="weight" type="number" step="0.1" placeholder="例：70.2"></div><div><label>摂取カロリー（kcal）</label><input id="dailyCalories" type="number" placeholder="例：2400"></div></div><button class="primary full" id="saveDaily">今日の記録を保存</button></section>
<section class="card"><div class="title-row"><h2>目標までの距離</h2><span class="pill">BODY</span></div><div class="metrics"><div class="metric"><small>現在体重</small><b id="latestWeight">—</b></div><div class="metric"><small>目標との差</small><b class="accent" id="weightDistance">—</b></div><div class="metric"><small>今日の残り</small><b id="calorieRemaining">—</b></div></div><div class="form-grid" style="margin-top:13px"><div><label>目標体重（kg）</label><input id="goalWeight" type="number" step="0.1"></div><div><label>目標カロリー（kcal）</label><input id="goalCalories" type="number"></div></div><button class="secondary full" id="saveGoals">目標を更新</button></section>
<section class="card"><div class="title-row"><h2>体重の推移</h2><span class="pill">30 DAYS</span></div><canvas id="weightChart" class="chart"></canvas></section><section class="card"><div class="title-row"><h2>食事を追加</h2><span class="pill">TODAY</span></div><div class="cal-row"><input id="mealName" placeholder="例：鶏むね肉定食"><input id="mealCal" type="number" placeholder="kcal"><button class="primary" id="addMeal">追加</button></div><div class="list" id="mealList"></div></section>
<section class="card wide"><div class="title-row"><h2>トレーニングカレンダー</h2><span class="pill">WORKOUT HISTORY</span></div><div class="calendar-layout"><div><div class="calendar-nav"><button class="secondary" id="prevCal">‹ 前月</button><b id="calTitle"></b><button class="secondary" id="nextCal">翌月 ›</button></div><div class="calendar-week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="calendar-days" id="calendarDays"></div></div><div class="day-detail"><h3 id="selectedDateTitle"></h3><div id="selectedWorkout"></div></div></div></section>
<section class="card wide"><div class="title-row"><h2>トレーニング実績</h2><span class="pill">LOG</span></div><div class="log-grid"><div><label>実施日</label><input id="liftDate" type="date"></div><div><label>種目</label><input id="liftName" list="liftOptions" placeholder="例：ベンチプレス"><datalist id="liftOptions"><option value="ベンチプレス"><option value="ポーズベンチ"><option value="スクワット"><option value="デッドリフト"><option value="バーベルロウ"><option value="ラットプルダウン"><option value="ショルダープレス"></datalist></div><div><label>重量 kg</label><input id="liftWeight" type="number" step="2.5"></div><div><label>回数</label><input id="liftReps" type="number"></div><div><label>セット</label><input id="liftSets" type="number" value="3"></div><button class="primary" id="saveLift">記録</button></div><div class="list" id="liftList"></div></section></div></main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),KEY='forge-v1',now=new Date(),iso=d=>new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10),today=iso(now),defaults={started:today,start1rm:66.5,goals:{weight:null,calories:2400},daily:[],meals:[],lifts:[]};let db;try{db={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=structuredClone(defaults)}db.goals={...defaults.goals,...db.goals};const persist=()=>localStorage.setItem(KEY,JSON.stringify(db)),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),oneRM=(w,r)=>w*(1+r/30);function rm(){let a=db.lifts.filter(x=>x.name==='ベンチプレス');return a.length?Math.max(db.start1rm,...a.map(x=>oneRM(x.weight,x.reps))):db.start1rm}function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
function render(){let r=rm(),last=[...db.daily].reverse().find(x=>x.weight),td=db.daily.find(x=>x.date===today),meals=db.meals.filter(x=>x.date===today),cal=(td?.calories||0)+meals.reduce((a,x)=>a+x.calories,0);$('#today').textContent=now.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('#estimated1rm').textContent=r.toFixed(1)+' kg';$('#benchDistance').textContent=Math.max(0,100-r).toFixed(1)+'kg';$('#benchProgress').style.width=Math.min(100,r)+'%';$('#latestWeight').textContent=last?.weight?last.weight.toFixed(1)+'kg':'—';$('#weightDistance').textContent=last?.weight&&db.goals.weight?Math.abs(last.weight-db.goals.weight).toFixed(1)+'kg':'—';$('#calorieRemaining').textContent=db.goals.calories?(db.goals.calories-cal>=0?db.goals.calories-cal+'kcal':'+'+Math.abs(db.goals.calories-cal)+'kcal'):'—';$('#goalWeight').value=db.goals.weight||'';$('#goalCalories').value=db.goals.calories||'';$('#dailyCalories').value=td?.calories||'';renderMeals(meals);renderLifts();drawChart()}
function renderMeals(a){$('#mealList').innerHTML=a.length?a.slice().reverse().map(x=>`<div class="entry"><div><b>${esc(x.name)}</b><span>${x.calories} kcal</span></div><button class="danger" data-meal="${x.id}">削除</button></div>`).join(''):'<div class="empty">今日の食事はまだありません。</div>'}function renderLifts(){let a=db.lifts.slice(-4).reverse();$('#liftList').innerHTML=a.length?a.map(x=>`<div class="entry"><div><b>${esc(x.name)} ${x.weight}kg × ${x.reps}</b><span>${x.date} · 推定1RM ${oneRM(x.weight,x.reps).toFixed(1)}kg</span></div><button class="danger" data-lift="${x.id}">削除</button></div>`).join(''):'<div class="empty">実績を登録するとここに表示されます。</div>'}
function drawChart(){let c=$('#weightChart'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.scale(d,d);let dates=Array.from({length:30},(_,i)=>{let z=new Date();z.setDate(z.getDate()-29+i);return iso(z)}),v=dates.map(z=>db.daily.find(q=>q.date===z)?.weight||null),all=v.filter(Boolean).concat(db.goals.weight?[db.goals.weight]:[]);if(!all.length){x.fillStyle='#68716c';x.font='13px sans-serif';x.fillText('体重を記録するとグラフが表示されます',15,h/2);return}let lo=Math.min(...all)-1,hi=Math.max(...all)+1,px=i=>35+i*(w-48)/29,py=n=>12+(hi-n)*(h-36)/(hi-lo);x.strokeStyle='#e1e4dc';for(let i=0;i<3;i++){let y=12+i*(h-36)/2;x.beginPath();x.moveTo(35,y);x.lineTo(w-10,y);x.stroke()}if(db.goals.weight){x.setLineDash([5,4]);x.strokeStyle='#ff7956';x.beginPath();x.moveTo(35,py(db.goals.weight));x.lineTo(w-10,py(db.goals.weight));x.stroke();x.setLineDash([])}x.strokeStyle='#164f3b';x.lineWidth=2.5;x.beginPath();let s=false;v.forEach((n,i)=>{if(n){s?x.lineTo(px(i),py(n)):x.moveTo(px(i),py(n));s=true}});x.stroke()}
$('#saveDaily').onclick=()=>{let weight=Number($('#weight').value)||null,calories=Number($('#dailyCalories').value)||0,i=db.daily.findIndex(x=>x.date===today),old=i>=0?db.daily[i]:{};let v={date:today,weight:weight||old.weight||null,calories};i>=0?db.daily[i]=v:db.daily.push(v);persist();$('#weight').value='';toast('今日の記録を保存しました');render()};$('#saveGoals').onclick=()=>{db.goals={weight:Number($('#goalWeight').value)||null,calories:Number($('#goalCalories').value)||null};persist();toast('目標を更新しました');render()};$('#addMeal').onclick=()=>{let name=$('#mealName').value.trim(),calories=Number($('#mealCal').value);if(!name||!calories)return toast('食事名とカロリーを入力してください');db.meals.push({id:crypto.randomUUID(),date:today,name,calories});persist();$('#mealName').value=$('#mealCal').value='';render()};document.body.onclick=e=>{if(e.target.dataset.meal){db.meals=db.meals.filter(x=>x.id!==e.target.dataset.meal);persist();render()}if(e.target.dataset.lift){db.lifts=db.lifts.filter(x=>x.id!==e.target.dataset.lift);persist();render()}};
window.addEventListener('resize',drawChart);if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');render();
</script><script>
let calView=new Date(now.getFullYear(),now.getMonth(),1),selectedDate=today;$('#liftDate').value=today;
renderLifts=()=>{let a=db.lifts.slice(-6).reverse();$('#liftList').innerHTML=a.length?a.map(x=>`<div class="entry"><div><b>${esc(x.name)} ${x.weight}kg × ${x.reps}回 × ${x.sets||1}セット</b><span>${x.date}${x.name.includes('ベンチ')?' · 推定1RM '+oneRM(x.weight,x.reps).toFixed(1)+'kg':''}</span></div><button class="danger" data-lift="${x.id}">削除</button></div>`).join(''):'<div class="empty">実績を登録するとここに表示されます。</div>'};
function renderCalendar(){let y=calView.getFullYear(),m=calView.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells=[];$('#calTitle').textContent=`${y}年 ${m+1}月`;for(let i=first.getDay()-1;i>=0;i--)cells.push({n:prev-i,date:iso(new Date(y,m-1,prev-i)),out:true});for(let n=1;n<=last;n++)cells.push({n,date:iso(new Date(y,m,n)),out:false});for(let n=1;cells.length<42;n++)cells.push({n,date:iso(new Date(y,m+1,n)),out:true});$('#calendarDays').innerHTML=cells.map(c=>`<button class="cal-day ${c.out?'out ':''}${c.date===today?'today ':''}${c.date===selectedDate?'selected ':''}${db.lifts.some(x=>x.date===c.date)?'has':''}" data-caldate="${c.date}">${c.n}</button>`).join('');let a=db.lifts.filter(x=>x.date===selectedDate),d=new Date(selectedDate+'T12:00:00');$('#selectedDateTitle').textContent=d.toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});$('#selectedWorkout').innerHTML=a.length?a.map(x=>`<div class="entry"><div><b>${esc(x.name)}</b><span>${x.weight}kg × ${x.reps}回 × ${x.sets||1}セット</span></div><button class="danger" data-lift="${x.id}">削除</button></div>`).join(''):'<p class="calendar-empty">この日の記録はありません。日付を選んで下の入力欄から登録できます。</p>'}
const baseRender=render;render=()=>{baseRender();renderLifts();renderCalendar()};$('#prevCal').onclick=()=>{calView.setMonth(calView.getMonth()-1);renderCalendar()};$('#nextCal').onclick=()=>{calView.setMonth(calView.getMonth()+1);renderCalendar()};document.addEventListener('click',e=>{let date=e.target.dataset.caldate;if(date){selectedDate=date;$('#liftDate').value=date;renderCalendar();$('#liftName').focus()}});
$('#saveLift').onclick=()=>{let date=$('#liftDate').value,name=$('#liftName').value.trim(),weight=Number($('#liftWeight').value),reps=Number($('#liftReps').value),sets=Number($('#liftSets').value);if(!date||!name||!weight||!reps||!sets)return toast('日付・種目・重量・回数・セット数を入力してください');db.lifts.push({id:crypto.randomUUID(),date,name,weight,reps,sets});persist();selectedDate=date;calView=new Date(date+'T12:00:00');calView.setDate(1);$('#liftWeight').value=$('#liftReps').value='';toast('カレンダーに記録しました');render()};render();
</script></body></html>
